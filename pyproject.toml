[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-knowledge-rag"
version = "0.1.0"
description = "A small, domain-agnostic knowledge RAG with citations, refusals, evals, and cost tracking. Demo corpus: a fictional travel agency."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
akr = "akr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
