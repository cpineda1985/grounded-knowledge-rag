name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Retrieval eval (offline, no API key)
        run: |
          akr eval --retrieval-only --out /tmp/tuning.json
          akr eval --retrieval-only --questions evals/heldout.jsonl --out /tmp/heldout.json
